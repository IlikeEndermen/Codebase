rules:
  - name: exif_metadata_extraction
    trigger:
      artifact_type: image
    steps:
      - tool: exiftool
        args: ["-j", "-n"]
        output_key: exif_metadata
    priority: critical

  - name: exif_timestamp_anomaly_detection
    trigger:
      artifact_type: image
    steps:
      - tool: exiftool
        args: ["-DateTimeOriginal", "-CreateDate", "-DateTime", "-FileModifyDate"]
        output_key: timestamps
    priority: high

  - name: png_lsb_steganography
    trigger:
      file_type: image/png
    steps:
      - tool: exiftool
        output_key: metadata
      - tool: zsteg
        args: ["-a"]
        output_key: zsteg_analysis
    priority: high

  - name: png_steghide_extraction
    trigger:
      file_type: image/png
    steps:
      - tool: exiftool
        output_key: metadata
      - tool: steghide
        args: ["info", "-p", ""]
        output_key: steghide_info
    priority: high

  - name: jpeg_steghide_extraction
    trigger:
      file_type: image/jpeg
    steps:
      - tool: exiftool
        output_key: metadata
      - tool: steghide
        args: ["info", "-p", ""]
        output_key: steghide_info
    priority: high

  - name: jpeg_metadata_analysis
    trigger:
      file_type: image/jpeg
    steps:
      - tool: exiftool
        args: ["-a"]
        output_key: full_exif
      - tool: strings
        args: ["-t", "d"]
        output_key: extracted_strings
    priority: medium

  - name: generic_embedded_file_detection
    trigger:
      artifact_type: image
    steps:
      - tool: binwalk
        args: ["-v"]
        output_key: binwalk_scan
    priority: high

  - name: binwalk_file_extraction
    trigger:
      artifact_type: image
    steps:
      - tool: binwalk
        args: ["-e", "-C", "/tmp/bigsister_extract"]
        output_key: binwalk_extraction
    priority: medium

  - name: file_type_identification
    trigger:
      artifact_type: image
    steps:
      - tool: file
        args: ["-b"]
        output_key: file_type_info
    priority: low

  - name: image_entropy_analysis
    trigger:
      artifact_type: image
    steps:
      - tool: binwalk
        args: ["-E", "-J"]
        output_key: entropy_analysis
    priority: medium